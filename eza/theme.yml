  number_kilo: { foreground: "#03FBC7" }
  number_mega: { foreground: "#FAC234" }
  number_giga: { foreground: "#FC7E03" }
  number_huge: { foreground: "#FA2120" }
  unit_byte: { foreground: "#B9AEB4" }
  unit_kilo: { foreground: "#03FBC7" }
  unit_mega: { foreground: "#FAC234" }
