# Crawler Neon for eza. Copy or symlink to ~/.config/eza/theme.yml, or point EZA_CONFIG_DIR at this folder.
# Generated by make_terminal_assets.py from crawler-neon-color-theme.json.
colourful: true

filekinds:
  normal: { foreground: "#F5EFE3" }
  directory: { foreground: "#B455F0" }
  symlink: { foreground: "#03FBC7" }
  pipe: { foreground: "#8B7F88" }
  block_device: { foreground: "#FAC234" }
  char_device: { foreground: "#FAC234" }
  socket: { foreground: "#8B7F88" }
  special: { foreground: "#FB03D6" }
  executable: { foreground: "#02FB03" }
  mount_point: { foreground: "#03FBC7" }

perms:
  user_read: { foreground: "#03FBC7" }
  user_write: { foreground: "#FC7E03" }
  user_execute_file: { foreground: "#02FB03" }
  user_execute_other: { foreground: "#02FB03" }
  group_read: { foreground: "#03FBC7" }
  group_write: { foreground: "#FC7E03" }
  group_execute: { foreground: "#02FB03" }
  other_read: { foreground: "#03FBC7" }
  other_write: { foreground: "#F4206E" }
